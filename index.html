<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Portfolio Profesional Markus Paru - Pengajar" />
    <meta name="theme-color" content="#0d6efd" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- My CSS -->
    <link rel="stylesheet" href="style.css" />
    <title>Markus Paru | Portfolio Profesional</title>
  </head>
  <body>
    <!-- ===== TEMPLATE PLACEHOLDERS ===== -->
    <div id="navbar-placeholder"></div>
    <div id="hero-placeholder"></div>
    <div id="about-placeholder"></div>
    <div id="projects-placeholder"></div>
    <div id="sertifikat-placeholder"></div>
    <div id="contact-placeholder"></div>
    <div id="modal-placeholder"></div>
    
    <!-- ===== VISITOR COUNTER ===== -->
    <div id="visitor-counter" class="visitor-counter">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-auto">
            <div class="counter-box">
              <i class="bi bi-eye-fill"></i>
              <span>Pengunjung:</span>
              <span id="visitorCount" class="counter-number">0</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- ===== SCRIPTS ===== -->
    <!-- Vendor Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
    
    <!-- Visitor Counter Script -->
    <script>
      // ===== VISITOR COUNTER =====
      (function() {
        // Gunakan CountAPI untuk menghitung pengunjung
        const COUNTER_URL = 'https://api.countapi.xyz/hit/markusparu-portfolio/visits';
        
        function updateCounter() {
          fetch(COUNTER_URL)
            .then(response => response.json())
            .then(data => {
              const counterElement = document.getElementById('visitorCount');
              if (counterElement && data.value) {
                // Animasi angka
                animateNumber(counterElement, data.value);
              }
            })
            .catch(error => {
              console.error('Error loading visitor count:', error);
              // Fallback: gunakan localStorage jika API gagal
              let count = localStorage.getItem('visitorCount') || 0;
              count = parseInt(count) + 1;
              localStorage.setItem('visitorCount', count);
              const counterElement = document.getElementById('visitorCount');
              if (counterElement) {
                animateNumber(counterElement, count);
              }
            });
        }

        function animateNumber(element, target) {
          const duration = 1000;
          const start = 0;
          const startTime = performance.now();
          
          function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const current = Math.floor(progress * target);
            element.textContent = current.toLocaleString('id-ID');
            
            if (progress < 1) {
              requestAnimationFrame(update);
            } else {
              element.textContent = target.toLocaleString('id-ID');
            }
          }
          
          requestAnimationFrame(update);
        }

        // Jalankan setelah halaman dimuat
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', updateCounter);
        } else {
          updateCounter();
        }
      })();
    </script>
    
    <!-- Custom Loader -->
    <script src="loader.js"></script>

  </body>
</html>
